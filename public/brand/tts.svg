<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 背景：暖奶油圆角方块 -->
  <rect width="64" height="64" rx="14" fill="#faf9f5"/>
  <!-- 声波柱（珊瑚色，从中间向两侧递减） -->
  <g fill="#cc785c">
    <rect x="10" y="26" width="4" height="12" rx="2"/>
    <rect x="18" y="20" width="4" height="24" rx="2"/>
    <rect x="26" y="14" width="4" height="36" rx="2" opacity="0.9"/>
  </g>
  <!-- 中央播放三角 -->
  <path d="M34 20 L50 32 L34 44 Z" fill="#141413"/>
  <!-- 右侧声波柱 -->
  <g fill="#5db8a6">
    <rect x="48" y="22" width="4" height="20" rx="2" opacity="0.85"/>
    <rect x="54" y="28" width="3" height="8" rx="1.5" opacity="0.7"/>
  </g>
</svg>
